  - name: secondaryIp
    type: alpha-fixed
    size: 16
  - name: secondaryPort
    type: uint16
  - name: sessionStatus
    type: uint8
    enums:
      0: "SessionActive"
      1: "SessionPasswordChanged"
      2: "SessionPasswordDueToExpire"
      3: "NewPasswordNotCompliant"
      4: "SessionLogoutComplete"
      5: "InvalidUsernameOrPassword"
      6: "AccountLocked"
      7: "LogonNotAllowed"
      8: "PasswordExpired"
      100: "PasswordChangeRequired"
      101: "Other"
  - name: side
    type: uint8
    enums: { 1: "Buy", 2: "Sell", 5: "SellShort" }
  - name: startSequence
    type: uint32
  - name: status
    type: uint8
    enums: { 0: "Accepted", 1: "Rejected" }
  - name: submittingBcanField
    type: alpha-fixed
    size: 21
  - name: submittingBrokerId
    type: alpha-fixed
    size: 12
  - name: text
    type: alpha-var
    maxLength: 50
  - name: tif
    type: uint8
    enums: { 0: "Day", 3: "IOC", 4: "FOK", 9: "AtCrossing" }
  - name: testMessageIndicator
    type: uint8
    enums: { 0: "ProductionMode", 1: "TestMode" }
  - name: testRequestId
    type: uint16
  - name: totalNoPartyList
    type: uint16
  - name: transactionTime
    type: alpha-fixed
    size: 25
  - name: tradeType
    type: uint8
    enums: { 4: "LateTrade", 22: "PrivatelyNegotiated", 102: "OddLotTrade", 104: "OverseasTrade" }
  - name: tradeReportId
    type: alpha-fixed
    size: 21
  - name: tradeReportTransType
    type: uint8
    enums: { 0: "New", 2: "Replace", 5: "CancelBackOut" }
  - name: tradeReportType
    type: uint8
    enums: { 0: "New", 4: "Addendum", 6: "TradeReportCancel" }
  - name: tradeReportStatus
    type: uint8
    enums: { 0: "Accepted", 1: "Rejected" }
  - name: tradeReportRejectCode
    type: uint16
    enums:
      4: "InvalidTradeType"
      5: "PriceExceedsBand"
      6: "ReferencePriceNotAvailable"
      7: "NotionalExceedsThreshold"
      99: "Other"
  - name: tradeId
    type: alpha-fixed
    size: 25
  - name: tradeMatchId
    type: alpha-fixed
    size: 25
  - name: tradeHandlingInstructions
    type: uint8
    enums: { 0: "TradeConfirm", 1: "TwoPartyReport", 6: "OnePartyReport" }
  - name: throttleAction
    type: uint8
    enums: { 2: "Rejected" }
  - name: throttleNoMessages
    type: uint32
  - name: throttleTimeInterval
    type: uint16
  - name: throttleTimeUnit
    type: uint8
    enums: { 0: "Seconds" }
  - name: throttleType
    type: uint8
    enums: { 0: "InboundRate" }
  - name: typeOfService
    type: uint8
    enums: { 1: "OrderInput" }
  - name: userName
    type: alpha-fixed
    size: 50
  - name: userRequestId
    type: alpha-fixed
    size: 20
  - name: userRequestType
    type: uint8
    enums: { 5: "RequestThrottleLimit" }
